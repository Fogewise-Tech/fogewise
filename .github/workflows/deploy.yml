name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fogewise-production
  cancel-in-progress: false

env:
  REPO_NAME: fogewise
  IMAGE_NAME: fogewise-web
  PUBLIC_DOMAIN: fogewise.io.vn

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VPS runtime
        run: |
          set -euo pipefail
          docker version >/dev/null
          docker compose version
          command -v caddy >/dev/null
          command -v systemctl >/dev/null

          if [ "$(id -u)" -ne 0 ]; then
            sudo -n true
          fi

      - name: Build production image on VPS
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Deploy local image on VPS
        run: |
          set -euo pipefail

          run_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }

          STATE_DIR="/var/lib/fogewise/apps/${REPO_NAME}"
          COMPOSE_FILE="${STATE_DIR}/compose.yml"
          TMP_COMPOSE="$(mktemp)"

          cat > "$TMP_COMPOSE" <<EOF
          services:
            web:
              image: ${IMAGE_NAME}:${GITHUB_SHA}
              labels:
                io.fogewise.managed: "true"
                io.fogewise.release: "${GITHUB_SHA}"
                io.fogewise.repo: "${REPO_NAME}"
                io.fogewise.route: "/"
                io.fogewise.service: "web"
              ports:
                - "127.0.0.1::8080"
              restart: unless-stopped
          EOF

          run_root install -d -m 755 "$STATE_DIR"
          run_root install -o root -g root -m 644 "$TMP_COMPOSE" "$COMPOSE_FILE"
          rm -f "$TMP_COMPOSE"

          docker compose -p "$REPO_NAME" -f "$COMPOSE_FILE" up -d --force-recreate --remove-orphans
          docker compose -p "$REPO_NAME" -f "$COMPOSE_FILE" ps -a
          sleep 3

          if ! docker compose -p "$REPO_NAME" -f "$COMPOSE_FILE" ps --status running --services | grep -Fxq web; then
            echo 'Web container is not running after deployment.' >&2
            echo '--- compose.yml ---' >&2
            cat "$COMPOSE_FILE" >&2 || true
            echo '--- web container logs ---' >&2
            docker compose -p "$REPO_NAME" -f "$COMPOSE_FILE" logs --no-color --tail=120 web >&2 || true
            exit 1
          fi

      - name: Configure apex Caddy route
        run: |
          set -euo pipefail

          run_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }

          COMPOSE_FILE="/var/lib/fogewise/apps/${REPO_NAME}/compose.yml"
          GENERATED_DOMAIN="${REPO_NAME}.fogewise.io.vn"
          ROOT_CONF="/etc/caddy/conf.d/${REPO_NAME}-root.caddy"

          HOST_ENDPOINT="$(docker compose -p "$REPO_NAME" -f "$COMPOSE_FILE" port web 8080 | head -n 1)"
          HOST_PORT="${HOST_ENDPOINT##*:}"
          case "$HOST_PORT" in
            ''|*[!0-9]*)
              echo "Unable to resolve published web port from: $HOST_ENDPOINT" >&2
              exit 1
              ;;
          esac

          for file in /etc/caddy/conf.d/*.caddy; do
            [ -e "$file" ] || continue
            [ "$file" = "$ROOT_CONF" ] && continue
            if grep -Fq "$GENERATED_DOMAIN" "$file" || \
               grep -Eq '^[[:space:]]*fogewise\.io\.vn[[:space:]]*\{' "$file"; then
              run_root rm -f "$file"
            fi
          done

          TMP_CONF="$(mktemp)"
          cat > "$TMP_CONF" <<EOF
          $PUBLIC_DOMAIN {
              import fogewise_common
              reverse_proxy 127.0.0.1:$HOST_PORT
          }
          EOF

          run_root install -o root -g root -m 644 "$TMP_CONF" "$ROOT_CONF"
          rm -f "$TMP_CONF"

          if ! run_root caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
            run_root rm -f "$ROOT_CONF"
            echo 'Caddy validation failed; apex route was removed.' >&2
            exit 1
          fi

          run_root systemctl reload caddy
          echo "Apex route configured: https://$PUBLIC_DOMAIN -> 127.0.0.1:$HOST_PORT"

      - name: Health check apex domain
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --insecure \
            --output /dev/null \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            --resolve "${PUBLIC_DOMAIN}:443:127.0.0.1" \
            "https://${PUBLIC_DOMAIN}/"
          echo "Origin health check passed for https://${PUBLIC_DOMAIN}."

      - name: Clean old local images
        if: success()
        run: |
          docker image prune --force
