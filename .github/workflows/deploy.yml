name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fogewise-production
  cancel-in-progress: false

env:
  REPO_NAME: fogewise
  IMAGE_NAME: ghcr.io/fogewise-tech/fogewise-web
  PUBLIC_DOMAIN: fogewise.io.vn

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH_CONFIG'
          Host *
            IdentitiesOnly yes
            ServerAliveInterval 20
            ServerAliveCountMax 15
            TCPKeepAlive yes
            ConnectTimeout 20
            ConnectionAttempts 3
          SSH_CONFIG
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config

      - name: Authorize VPS to pull GHCR image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          REMOTE_DOCKER_CONFIG="/run/fogewise-ghcr/${REPO_NAME}"
          ssh "$VPS_USER@$VPS_HOST" "install -d -m 700 '$REMOTE_DOCKER_CONFIG'"
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" \
            "DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null"

      - name: Upload Fogewise deployment manifest
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "
            set -eu
            APP_DIR='/srv/apps/${REPO_NAME}'
            FOGEWISE_DIR=\"\$APP_DIR/.fogewise\"
            install -d -o root -g root -m 700 \"\$APP_DIR\"
            install -d -o root -g root -m 755 \"\$FOGEWISE_DIR\"
          "
          rsync -az .fogewise/deploy.yml \
            "$VPS_USER@$VPS_HOST:/srv/apps/${REPO_NAME}/.fogewise/deploy.yml"
          ssh "$VPS_USER@$VPS_HOST" "
            chown root:root '/srv/apps/${REPO_NAME}/.fogewise/deploy.yml'
            chmod 644 '/srv/apps/${REPO_NAME}/.fogewise/deploy.yml'
          "

      - name: Pull and deploy image on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "REPO_SLUG='$GITHUB_REPOSITORY' IMAGE_TAG='$GITHUB_SHA' REPO_NAME='$REPO_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          export DOCKER_CONFIG="/run/fogewise-ghcr/$REPO_NAME"

          LOG_DIR='/var/log/fogewise'
          LOG_FILE="$LOG_DIR/${REPO_NAME}-deploy.log"
          install -d -m 700 "$LOG_DIR"
          touch "$LOG_FILE"
          chmod 600 "$LOG_FILE"

          (umask 022; /usr/local/sbin/fogewise-deploy "$REPO_SLUG" "$IMAGE_TAG") >"$LOG_FILE" 2>&1 &
          DEPLOY_PID=$!
          trap 'kill "$DEPLOY_PID" 2>/dev/null || true' HUP INT TERM

          while kill -0 "$DEPLOY_PID" 2>/dev/null; do
            echo 'Fogewise deploy still running...'
            sleep 20
          done

          if wait "$DEPLOY_PID"; then
            echo 'Fogewise deploy succeeded.'
          else
            echo "Fogewise deploy failed. Inspect $LOG_FILE" >&2
            tail -n 100 "$LOG_FILE" >&2 || true
            exit 1
          fi
          trap - HUP INT TERM

          docker compose \
            -p "$REPO_NAME" \
            -f "/var/lib/fogewise/apps/$REPO_NAME/compose.json" \
            ps
          REMOTE

      - name: Configure apex Caddy route
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "REPO_NAME='$REPO_NAME' PUBLIC_DOMAIN='$PUBLIC_DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail

          COMPOSE_FILE="/var/lib/fogewise/apps/$REPO_NAME/compose.json"
          GENERATED_DOMAIN="${REPO_NAME}.fogewise.io.vn"
          ROOT_CONF="/etc/caddy/conf.d/${REPO_NAME}-root.caddy"

          HOST_ENDPOINT="$(docker compose -p "$REPO_NAME" -f "$COMPOSE_FILE" port web 8080 | head -n 1)"
          HOST_PORT="${HOST_ENDPOINT##*:}"
          case "$HOST_PORT" in
            ''|*[!0-9]*)
              echo "Unable to resolve published web port from: $HOST_ENDPOINT" >&2
              exit 1
              ;;
          esac

          for file in /etc/caddy/conf.d/*.caddy; do
            [ -e "$file" ] || continue
            [ "$file" = "$ROOT_CONF" ] && continue
            if grep -Fq "$GENERATED_DOMAIN" "$file" || \
               grep -Eq '^[[:space:]]*fogewise\.io\.vn[[:space:]]*\{' "$file"; then
              rm -f "$file"
            fi
          done

          TMP_CONF="$(mktemp)"
          cat > "$TMP_CONF" <<EOF
          $PUBLIC_DOMAIN {
              import fogewise_common
              reverse_proxy 127.0.0.1:$HOST_PORT
          }
          EOF

          install -o root -g root -m 644 "$TMP_CONF" "$ROOT_CONF"
          rm -f "$TMP_CONF"

          if ! caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
            rm -f "$ROOT_CONF"
            echo 'Caddy validation failed; apex route was removed.' >&2
            exit 1
          fi

          systemctl reload caddy
          echo "Apex route configured: https://$PUBLIC_DOMAIN -> 127.0.0.1:$HOST_PORT"
          REMOTE

      - name: Health check apex domain
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            curl \
              --fail \
              --silent \
              --show-error \
              --insecure \
              --output /dev/null \
              --retry 10 \
              --retry-delay 3 \
              --retry-all-errors \
              --resolve '${PUBLIC_DOMAIN}:443:127.0.0.1' \
              'https://${PUBLIC_DOMAIN}/'
          "
          echo "Origin health check passed for https://${PUBLIC_DOMAIN}."

      - name: Remove temporary VPS registry credentials
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -s ~/.ssh/id_ed25519 ] && [ -s ~/.ssh/known_hosts ]; then
            ssh "$VPS_USER@$VPS_HOST" \
              "rm -rf '/run/fogewise-ghcr/${REPO_NAME}'" || true
          fi
