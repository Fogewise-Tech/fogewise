name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fogewise-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/fogewise-local-deploy \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_SHA"
